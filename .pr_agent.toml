# PR Agent review policy. Read from the default branch, so a pull request
# cannot change the policy for its own review.
# See docs/development/pr_agent.md.

[config]
# Release PRs are generated. The first pattern is PR Agent's default, which
# setting this key would otherwise drop. A matching title also blocks comment
# commands, so only list PRs nobody would want reviewed.
ignore_pr_title = ["^\\[Auto\\]", "^Bump version to"]
# The review is not always produced by the primary model, and which one
# answered explains a thin review without reading the run log.
output_run_details = true
# The review rules live in these files; the first is shared with GitHub
# Copilot's reviewer. They share one line budget that truncates from the end,
# so the file named in 'extra_instructions' goes first and the build and test
# instructions in AGENTS.md last.
repo_context_files = [".github/copilot-instructions.md", "CODING_GUIDELINES.md", "AGENTS.md"]
# The three files exceed the 500-line default; the budget is small next to
# the diff.
repo_context_max_lines = 700

[pr_code_suggestions]
# Above the default, to drop marginal suggestions.
suggestions_score_threshold = 6

[pr_reviewer]
# The generic usage guide is noise on every review; the commands are listed in
# the CI reminder comment and docs/development/pr_agent.md.
enable_help_text = false
# A diff larger than the token budget is split into up to 'max_number_of_calls'
# (default 3) chunks reviewed in parallel and merged, instead of dropping
# whole files. Chunks are only made when the diff does not fit, so normal PRs
# cost the same; a chunked review costs roughly one call per chunk.
enable_large_pr_chunking = true
extra_instructions = "Follow the review rules in `.github/copilot-instructions.md`, included in the repository context below."
# An updated review replaces its comment in place; a second comment pointing
# at it is noise.
final_update_message = false
# A finding on the line it concerns is easier to act on than one in a summary
# comment. Model output already reaches the PR as a comment, so this moves it
# rather than granting it anything new.
inline_key_issues = true
# Three findings is too few for the size of a typical ICON4Py PR.
num_max_findings = 10
# Explicit rather than default: a review that found nothing should say so,
# because silence is indistinguishable from the bot not having run.
publish_output_no_suggestions = true
# This and the three 'require_*' keys that follow it are assessment fields on
# the single review request, not extra AI calls, so they cost latency and
# spend only through the larger answer they ask for.
require_can_be_split_review = true
require_failure_modes = true
require_merge_recommendation = true
require_score_review = true
# ICON4Py PRs rarely reference a ticket.
require_ticket_analysis_review = false
