include:
  - local: '.cscs-ci/base.yml'
  - local: '.cscs-ci/benchmark_bencher_common.yml'

.bencher_feature_tests:
  extends: [.benchmark_nox_job]
  script:
    - !reference [.bencher_github_event_setup, script]
    - !reference [.benchmark_nox_job, script]
  variables:
    NOX_SESSION: "__bencher_feature_branch_CI-${PYVERSION_SHORT}"

.bencher_driver_mpi_feature_tests:
  extends: [.test_runner_mpi, .test_template_aarch64, .benchmark_driver_mpi_nox_job]
  stage: benchmark
  script:
    - !reference [.bencher_github_event_setup, script]
    - !reference [.benchmark_driver_mpi_nox_job, script]
  variables:
    NOX_SESSION: "__bencher_driver_mpi_feature_branch_CI-${PYVERSION_SHORT}"

.bencher_driver_feature_tests:
  extends: [.test_runner_serial, .test_template_aarch64, .benchmark_driver_nox_job]
  stage: benchmark
  script:
    - !reference [.bencher_github_event_setup, script]
    - !reference [.benchmark_driver_nox_job, script]
  variables:
    NOX_SESSION: "__bencher_driver_feature_branch_CI-${PYVERSION_SHORT}"

benchmark_bencher_stencils_feature_aarch64:
  extends: [.test_runner_serial, .test_template_aarch64, .bencher_feature_tests]
  variables:
    TEST_SELECTION: "${STENCIL_TEST_SELECTION}"
    GT4PY_COLLECT_METRICS_LEVEL: 10
  rules:
    - when: never  # TEMPORARY: disabled for driver bencher trial; restore before merge

benchmark_bencher_granules_feature_aarch64:
  extends: [.test_runner_serial, .test_template_aarch64, .bencher_feature_tests]
  variables:
    TEST_SELECTION: "${GRANULE_TEST_SELECTION}"
  rules:
    - when: never  # TEMPORARY: disabled for driver bencher trial; restore before merge

benchmark_bencher_driver_mpi_feature_aarch64:
  extends: [.bencher_driver_mpi_feature_tests, .retry_on_transient_failure]
  variables:
    SLURM_NTASKS: 4
    SLURM_JOB_NUM_NODES: 1
    ICON4PY_TEST_MPI_SUBCOMM_SIZE: $SLURM_NTASKS
  rules:
    - if: $ICON4PY_DISABLE_DRIVER_BENCHMARK == "1" || $ICON4PY_DISABLE_DRIVER_BENCHMARK == "true"
      when: never
    - when: on_success

benchmark_bencher_driver_feature_aarch64:
  extends: [.bencher_driver_feature_tests, .retry_on_transient_failure]
  rules:
    - if: $ICON4PY_DISABLE_DRIVER_BENCHMARK == "1" || $ICON4PY_DISABLE_DRIVER_BENCHMARK == "true"
      when: never
    - when: on_success
