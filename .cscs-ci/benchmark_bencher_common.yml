.benchmark_model_base_variables:
  variables:
    ICON4PY_ENABLE_GRID_DOWNLOAD: true
    ICON4PY_ENABLE_TESTDATA_DOWNLOAD: true
    PYTHONOPTIMIZE: 2
    STENCIL_TEST_SELECTION: "test_Test and compile_time_domain"
    GRANULE_TEST_SELECTION: "test_diffusion_benchmark or test_benchmark_solve_nonhydro"
    OMP_PROC_BIND: close
    OMP_PLACES: cores
    OMP_NUM_THREADS: 72

.benchmark_driver_base_variables:
  variables:
    TEST_SELECTION: "test_benchmark_driver"
    BACKEND: "dace_gpu"
    GRID: "R02B06_GLOBAL"
    SLURM_TIMELIMIT: '02:00:00'
    OMP_PROC_BIND: close
    OMP_PLACES: cores
    OMP_NUM_THREADS: 72

.benchmark_nox_job:
  stage: benchmark
  script:
    - nox -s ${NOX_SESSION} -- --backend=$BACKEND --grid=$GRID -k "${TEST_SELECTION}"
  parallel:
    matrix:
      - BACKEND: [dace_cpu, dace_gpu, gtfn_cpu, gtfn_gpu]
        GRID: [icon_benchmark_regional, icon_benchmark_global]
  extends: [.benchmark_model_base_variables]
  variables:
    SLURM_JOB_NUM_NODES: 1
    SLURM_NTASKS: 1
    SLURM_GPUS_PER_TASK: 1
    SLURM_GPUS_PER_NODE: 1
    SLURM_CPUS_PER_TASK: 72
    SLURM_PARTITION: normal
    SLURM_TIMELIMIT: '01:30:00'

.benchmark_driver_nox_job:
  stage: benchmark
  script:
    - .cscs-ci/scripts/ci-mpi-wrapper.sh nox -s "${NOX_SESSION}" -- --backend=$BACKEND --grid=$GRID -k "${TEST_SELECTION}"
  extends: [.benchmark_driver_base_variables]
  variables:
    # Full-node layout: 4 ranks on 4 GPUs (ci-mpi-wrapper.sh pins one GPU per
    # rank), 72 CPUs per rank. allow-task-sharing lets NCCL open peer GPUs for
    # GPU-GPU communication.
    SLURM_GPUS_PER_NODE: 4
    SLURM_CPUS_PER_TASK: 72
    SLURM_GRES_FLAGS: allow-task-sharing
  parallel:
    matrix:
      - BACKEND: [dace_gpu]

.benchmark_driver_single_rank_nox_job:
  stage: benchmark
  script:
    - nox -s "${NOX_SESSION}" -- --backend=$BACKEND --grid=$GRID -k "${TEST_SELECTION}"
  extends: [.benchmark_driver_base_variables]
  variables:
    SLURM_GPUS_PER_TASK: 1
    SLURM_CPUS_PER_TASK: 72
  parallel:
    matrix:
      - BACKEND: [dace_gpu]

.bencher_github_event_setup:
  script:
    - export PR_ID=$(echo "${CI_COMMIT_BRANCH}" | grep -o 'pr[0-9]*' | grep -o '[0-9]*')
    - export FEATURE_BRANCH=$(curl -s https://api.github.com/repos/C2SM/icon4py/pulls/$PR_ID | jq -r '.head.ref')
    - export GITHUB_ACTIONS=true
    - export GITHUB_EVENT_NAME=pull_request
    - export GITHUB_STEP_SUMMARY=$CI_PROJECT_DIR/step_summary.log
    - export GITHUB_SHA=$CI_COMMIT_SHA
    - export GITHUB_EVENT_PATH=$CI_PROJECT_DIR/event.json
    - |
      echo "{\"pull_request\": {\"head\": {\"repo\": {\"full_name\": \"C2SM/icon4py\"}}}, \"repository\": {\"full_name\": \"C2SM/icon4py\"}, \"number\": $PR_ID}" > $CI_PROJECT_DIR/event.json


build_baseimage_aarch64:
  extends: [.build_baseimage_aarch64]

build_venv_aarch64:
  extends: [.build_venv_aarch64]

build_image_aarch64:
  extends: [.build_image_aarch64]
