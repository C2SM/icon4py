display_name: Config File
type_name: <class 'icon4py.model.driver.config.ExperimentConfig'>
description: ICON4Py experiment configuration.
default: No default value.
optional: false
examples:
  - "Config File:\n  geometry:\n    use_analytical_means: true\n  metrics:\n    exner_expol: 0.3333333333333333\n    vwind_offctr: 0.15\n    thslp_zdiffu: 0.025\n    thhgtd_zdiffu: 200.0\n    rayleigh_type: klemp\n    rayleigh_coeff: 0.05\n    divdamp_trans_start: 12500.0\n    divdamp_trans_end: 17500.0\n    divdamp_type: 3\n    igradp_method: 3\n  interpolation:\n    divergence_averaging_central_cell_weight: 0.5\n    max_nudging_coefficient: 0.375\n    nudge_efold_width: 2.0\n    nudge_zone_width: 10\n    rbf_kernel_cell: gaussian\n    rbf_kernel_edge: inverse_multiquadratic\n    rbf_kernel_vertex: gaussian\n    lsq_dim_unk: 2\n    lsq_dim_c: 3\n    lsq_wgt_exp: 2\n    lsq_high_ord: 1\n  vertical_grid:\n    num_levels: 0\n    maximal_layer_thickness: 0.0\n    top_height_limit_for_maximal_layer_thickness: 0.0\n    lowest_layer_thickness: 0.0\n    model_top_height: 0.0\n    flat_height: 0.0\n    stretch_factor: 0.0\n    rayleigh_damping_height: 0.0\n    htop_moist_proc: 0.0\n    file_path: .\n    SLEVE_decay_scale_1: 0.0\n    SLEVE_decay_scale_2: 0.0\n    SLEVE_decay_exponent: 0.0\n    _SLEVE_minimum_layer_thickness_1: 0.0\n    _SLEVE_minimum_layer_thickness_2: 0.0\n    _SLEVE_minimum_relative_layer_thickness_1: 0.0\n    _SLEVE_minimum_relative_layer_thickness_2: 0.0\n  initial_condition:\n    type: jablonowski_williamson\n    p_sfc: 100000.0\n    baroclinic_amplitude: 1.0\n    u0: 35.0\n    temp0: 288.0\n    eta_0: 0.252\n    eta_t: 0.2\n    gamma: 0.005\n    dtemp: 480000.0\n    lon_perturbation_center: 0.3490658503988659\n    lat_perturbation_center: 0.6981317007977318\n    rh_at_1000hpa: 0.7\n    qv_max: 0.02\n    moisture_init_iterations: 10\n    global_moisture_content: 25.006\n    normalize_global_moisture: false\n  topography:\n    type: flat\n  prescribed_tendencies:\n    data_path:\n  driver:\n    experiment_name: ''\n    profiling_options:\n      gt4py_metrics_level: 100\n      gt4py_metrics_output_file: gt4py_metrics.json\n      skip_first_timestep: true\n    dtime: 0 seconds\n    start_of_simulation: '2026-01-01T00:00:00'\n    start_of_timestepping: '2026-01-01T00:00:00'\n    end_of_simulation:\n      type: relative\n      value: 0 seconds\n    output_path: .\n    apply_extra_second_order_divdamp: false\n    diffuse_before_time_loop: false\n    vertical_cfl_threshold: 0.0\n    ndyn_substeps: 0\n    enable_statistics_logging: false\n    enable_output: false\n    backend_config:\n      workspace_size: 268435456\n    output_backend: netcdf\n    output_mode: gather\n  nonhydrostatic:\n    itime_scheme: most_efficient\n    iadv_rhotheta: miura\n    igradp_method: taylor_hydro\n    rayleigh_type: klemp\n    divdamp_order: combined\n    divdamp_type: three_dimensional\n    l_vert_nested: false\n    deepatmos_mode: false\n    iau_init: false\n    extra_diffu: true\n    rhotheta_offctr: -0.1\n    veladv_offctr: 0.25\n    fourth_order_divdamp_factor: 0.0025\n    fourth_order_divdamp_factor2: 0.004\n    fourth_order_divdamp_factor3: 0.004\n    fourth_order_divdamp_factor4: 0.004\n    fourth_order_divdamp_z: 32500.0\n    fourth_order_divdamp_z2: 40000.0\n    fourth_order_divdamp_z3: 60000.0\n    fourth_order_divdamp_z4: 80000.0\n  diffusion:\n    diffusion_type: smagorinsky_4th_order\n    apply_to_vertical_wind: true\n    apply_to_horizontal_wind: true\n    apply_to_temperature: true\n    apply_smag_diff_to_vertical_wind: false\n    compute_3d_smag_coeff: false\n    type_vn_diffu: diamond_vertices\n    type_t_diffu: heterogeneous\n    hdiff_efdt_ratio: 36.0\n    hdiff_w_efdt_ratio: 15.0\n    smagorinski_scaling_factor: 0.015\n    smagorinski_scaling_factor2: 0.07137250670656087\n    smagorinski_scaling_factor3: 0.0\n    smagorinski_scaling_factor4: 1.0\n    smagorinski_scaling_height: 32500.0\n    smagorinski_scaling_height2: 60686.25335328044\n    smagorinski_scaling_height3: 50000.0\n    smagorinski_scaling_height4: 90000.0\n    apply_zdiffusion_t: true\n    temperature_boundary_diffusion_denominator: 135.0\n    velocity_boundary_diffusion_denominator: 200.0\n    shear_type: vertical_of_horizontal_wind\n    iforcing: no_forcing\n    a_hshr: 1.0\n    loutshs: false\n  tracer_config:\n    qv: false\n    qc: false\n    qi: false\n    qr: false\n    qs: false\n    qg: false\n  tracer_advection:\n    horizontal_advection_type: no_advection\n    horizontal_advection_limiter: no_limiter\n    vertical_advection_type: no_advection\n    vertical_advection_limiter: no_limiter\n  graupel:\n    liquid_autoconversion_option: seifert_beheng\n    snow_intercept_option: field_general_moment_estimation\n    do_latent_heat_nudging: false\n    use_constant_latent_heat: true\n    ice_stickeff_min: 0.075\n    power_law_coeff_for_ice_mean_fall_speed: 1.25\n    exponent_for_density_factor_in_ice_sedimentation: 0.33\n    power_law_coeff_for_snow_fall_speed: 20.0\n    rain_mu: 0.0\n    rain_n0: 1.0\n    snow2graupel_riming_coeff: 0.5\n  muphys:\n    qnc: 50000000.0\n  tmx:\n    solver_type: implicit\n    energy_type: internal\n    dissipation_factor: 1.0\n    use_louis: true\n    use_louis_land: true\n    use_louis_ice: true\n    louis_constant_b: 4.2\n    use_km_const: false\n    km_const: 1.0\n    use_scale_turb_energy_flux: false\n    scale_turb_energy_flux: 1.0\n    smag_constant: 0.23\n    turb_prandtl: 0.33333333333\n    km_min: 0.001\n    max_turb_scale: 300.0\n"
children:
  - display_name: shared
    type_name: list[icon4py.model.common.config.config_io.SharedOptionSet]
    description: Option - value pairs which are shared between sibling sections.
    default: '[]'
    optional: true
    examples:
      - 'shared: []

        '
      - "shared:\n  - <option 1>: <value 1>\n    <option 2>: <value 2>\n    consumers:\n      - <section A>\n      - <section B>\n"
    children: []
    config_name_path:
      - shared
    module_path: builtins
    is_union: false
  - display_name: geometry
    type_name: <class 'icon4py.model.common.grid.geometry_config.GeometryConfig'>
    description: "\n    Contains parameters to configure the computation of grid geometry fields.\n    "
    default: No default value.
    optional: false
    examples:
      - "geometry:\n  use_analytical_means: true\n"
    children:
      - display_name: use_analytical_means
        type_name: <class 'bool'>
        description: If True, compute mean geometry values (mean cell area, mean dual area, mean edge length, mean dual edge length) analytically from the grid parameters instead of using global reductions.
        default: 'True'
        optional: true
        examples:
          - 'use_analytical_means: false

            '
        children: []
        config_name_path:
          - geometry
          - use_analytical_means
        module_path: builtins
        is_union: false
    config_name_path:
      - geometry
    module_path: icon4py.model.common.grid.geometry_config
    is_union: false
