geometry: {}
metrics:
  rayleigh_coeff: 0.1
interpolation: {}
vertical_grid:
  num_levels: 35
  model_top_height: 23500.0
  lowest_layer_thickness: 0.0
topography:
  type: jablonowski_williamson
initial_condition:
  type: jablonowski_williamson
  baroclinic_amplitude: 0.0
nonhydrostatic:
  fourth_order_divdamp_factor: 0.004
  fourth_order_divdamp_factor2: 0.004
  fourth_order_divdamp_factor3: 0.004
  fourth_order_divdamp_factor4: 0.004
diffusion:
  apply_to_temperature: False
  hdiff_efdt_ratio: 10.0
  smagorinski_scaling_factor: 0.025
prescribed_tendencies:
  data_path:
driver:
  experiment_name: jablonowski_williamson
  profiling_options:
  dtime: 75 seconds
  enable_statistics_logging: True
  start_of_simulation: 2008-01-01T00:00:00
  start_of_timestepping: 2008-01-01T00:00:00
  end_of_simulation:
    type: absolute
    value: 2008-01-15T00:00:00
tracer_config:
  qv: false
  qc: false
  qr: false
  qi: false
  qs: false
  qg: false
tracer_advection:
graupel:
muphys:
tmx:
surface:
physics_coupling: sequential
io:
  output_path: output_sample
  field_groups:
    - basename: atmospheric_state
      variables:
        - eastward_wind
        - northward_wind
        - air_density
        - exner_function
        - virtual_potential_temperature
        - upward_air_velocity
      output_interval:
        type: numsteps
        value: 48
      timesteps_per_file: 0
      backend: netcdf
      mode: gather
      horizontal_chunk_size:
      horizontal_shard_size:
      nc_title: ICON4Py Simulation
      nc_comment: ICON inspired code in Python and GT4Py
  time_units: seconds since 1970-01-01 00:00:00
  calendar: proleptic_gregorian
