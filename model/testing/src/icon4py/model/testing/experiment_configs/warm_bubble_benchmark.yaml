geometry: {}
metrics: {}
interpolation: {}
vertical_grid:
  num_levels: 100
  model_top_height: 20000.0
  lowest_layer_thickness: 0.0
topography:
  type: flat
initial_condition:
  type: weisman_klemp
  max_wind_speed: 15.0
  bubble_center_x: 0.0
  bubble_center_y: 0.0
  bubble_center_z: 1400.0
  bubble_horizontal_width: 10000.0
  bubble_vertical_width: 1400.0
  bubble_amplitude: 2.0
  bubble_radius: 1.0
nonhydrostatic:
  fourth_order_divdamp_factor: 0.004
  fourth_order_divdamp_factor2: 0.004
  fourth_order_divdamp_factor3: 0.004
  fourth_order_divdamp_factor4: 0.004
diffusion:
  hdiff_efdt_ratio: 24.0
  smagorinski_scaling_factor: 0.025
  apply_zdiffusion_t: False
  shear_type: vertical_horizontal_of_horizontal_vertical_wind
  a_hshr: 2.0
prescribed_tendencies:
  data_path:
driver:
  experiment_name: warm_bubble
  profiling_options:
  dtime: 200 milliseconds
  enable_statistics_logging: True
  start_of_simulation: 1970-01-01T00:00:00
  start_of_timestepping: 1970-01-01T00:00:00
  end_of_simulation:
    type: numsteps
    value: 36000
tracer_config:
  qv: true
  qc: true
  qr: true
  qi: true
  qs: true
  qg: true
tracer_advection:
  horizontal_advection_type: second_order_linear_miura
  horizontal_advection_limiter: positive_definite
  vertical_advection_type: third_order_ppm
  vertical_advection_limiter: semi_monotonic
graupel:
muphys: {}
tmx: {}
surface:
  surface_flux_type: fixed_heat_fluxes
  kinematic_sensible_heat_flux: 0.0
  kinematic_latent_heat_flux: 0.0
  sea_surface_temperature: 300.0
io:
  output_path: output_sample
  field_groups:
    - basename: winds
      variables:
        - eastward_wind
        - northward_wind
        - air_density
        - exner_function
        - virtual_potential_temperature
        - upward_air_velocity
        - qv
        - qc
        - qr
        - qi
        - qs
        - qg
      output_interval:
        type: numsteps
        value: 300
      timesteps_per_file: 0
      backend: netcdf
      mode: gather
      horizontal_chunk_size:
      horizontal_shard_size:
      nc_title: ICON4Py Simulation
      nc_comment: ICON inspired code in Python and GT4Py
  time_units: seconds since 1970-01-01 00:00:00
  calendar: proleptic_gregorian
