name: ICON4Py Unit Tests
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]
  merge_group:

concurrency:
  # A new push to a pull request cancels its running tests. A group holds at most one
  # pending run and replaces it on the next arrival, so every other run gets its own group.
  group: icon4py-test-model-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ICON4PY_TEST_DATA_PATH: "${{ github.workspace }}/testdata"
  NUM_PROCESSES: auto
  ICON4PY_ENABLE_GRID_DOWNLOAD: false
  ICON4PY_ENABLE_TESTDATA_DOWNLOAD: false
  PYTEST_ADDOPTS: "--durations=0"
  GT4PY_BUILD_CACHE_LIFETIME: persistent

jobs:
  test-model:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
        backend: ["embedded", "dace_cpu", "gtfn_cpu"]
        component: ["tracer_advection", "diffusion", "dycore", "microphysics", "muphys", "tmx", "physics_driver", "common", "driver"]
        exclude:
          - {backend: "dace_cpu", component: "dycore"}
          - {backend: "gtfn_cpu", component: "dycore"}
        include:
          - {python-version: "3.12", backend: "dace_cpu", component: "dycore", shard: "1/4"}
          - {python-version: "3.12", backend: "dace_cpu", component: "dycore", shard: "2/4"}
          - {python-version: "3.12", backend: "dace_cpu", component: "dycore", shard: "3/4"}
          - {python-version: "3.12", backend: "dace_cpu", component: "dycore", shard: "4/4"}
          - {python-version: "3.12", backend: "gtfn_cpu", component: "dycore", shard: "1/4"}
          - {python-version: "3.12", backend: "gtfn_cpu", component: "dycore", shard: "2/4"}
          - {python-version: "3.12", backend: "gtfn_cpu", component: "dycore", shard: "3/4"}
          - {python-version: "3.12", backend: "gtfn_cpu", component: "dycore", shard: "4/4"}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.6"
          enable-cache: false
          cache-dependency-glob: "uv.lock"
          python-version: ${{ matrix.python-version }}

      - name: cache key
        id: cache-key
        run: |
          echo "key=$(./scripts/python/validation_grid_utils.py cache-key)" >> $GITHUB_OUTPUT

      - name: gridfile cache
        id: grid-cache
        uses: actions/cache@v6
        with:
          path: testdata/grids
          key: ${{ steps.cache-key.outputs.key }}

      - name: download grids
        if: steps.grid-cache.outputs.cache-hit != 'true'
        env:
          ICON4PY_ENABLE_GRID_DOWNLOAD: true
        run: |
          ./scripts/python/validation_grid_utils.py download

      - name: set GT4Py cache directory
        # Note that this assumes that each backend gets a separate job in CI.
        # Mixing e.g. dace_cpu and dace_gpu in the same cache directory may not
        # work well.
        run: echo "GT4PY_BUILD_CACHE_DIR=${{ runner.temp }}/gt4py-cache" >> $GITHUB_ENV

      - name: restore GT4Py cache
        id: gt4py-cache-restore
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.GT4PY_BUILD_CACHE_DIR }}
          key: gt4py-${{ runner.os }}-${{ hashFiles('uv.lock') }}-py${{ matrix.python-version }}-${{ matrix.backend }}-${{ matrix.component }}${{ matrix.shard && format('-shard-{0}', matrix.shard) || '' }}-branch-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            gt4py-${{ runner.os }}-${{ hashFiles('uv.lock') }}-py${{ matrix.python-version }}-${{ matrix.backend }}-${{ matrix.component }}${{ matrix.shard && format('-shard-{0}', matrix.shard) || '' }}-branch-${{ github.head_ref || github.ref_name }}-
            gt4py-${{ runner.os }}-${{ hashFiles('uv.lock') }}-py${{ matrix.python-version }}-${{ matrix.backend }}-${{ matrix.component }}${{ matrix.shard && format('-shard-{0}', matrix.shard) || '' }}-branch-main-

      - name: run nox session - unit tests
        # These packages have no tests in this selection.
        if: ${{ !contains(fromJSON('["dycore", "microphysics", "muphys", "tracer_advection"]'), matrix.component) }}
        shell: bash
        run: |
          uvx nox -s "test_model-${{matrix.python-version}}(basic, ${{ matrix.component }})" -- --backend=${{ matrix.backend }}

      - name: run nox session - stencil tests
        shell: bash
        env:
          SHARD_ARGS: ${{ matrix.shard && format('--shard={0}', matrix.shard) || '' }}
          # This test takes ~14 min on dace_cpu.
          DESELECT_ARGS: ${{ matrix.backend == 'dace_cpu' && matrix.component == 'tracer_advection' && '--deselect=model/atmosphere/tracer_advection/tests/tracer_advection/stencil_tests/test_prepare_ffsl_flux_area_patches_list.py' || '' }}
        run: |
          uvx nox -s "test_model-${{matrix.python-version}}(stencils, ${{ matrix.component }})" -- --backend=${{ matrix.backend }} --grid=icon_regional $SHARD_ARGS $DESELECT_ARGS

      - name: save GT4Py cache
        # A merge queue run saves under a key nothing restores.
        if: always() && github.event_name != 'merge_group'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.GT4PY_BUILD_CACHE_DIR }}
          key: gt4py-${{ runner.os }}-${{ hashFiles('uv.lock') }}-py${{ matrix.python-version }}-${{ matrix.backend }}-${{ matrix.component }}${{ matrix.shard && format('-shard-{0}', matrix.shard) || '' }}-branch-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
