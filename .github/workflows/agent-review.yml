name: Agent Review

# Advisory review by a sandboxed coding agent; never a required check.
# Caller of the reusable workflow in GridTools/ci-workflows.
# See docs/development/agent_review.md.

on:
  # 'pull_request_target' because fork PRs get no secrets under
  # 'pull_request'. The Actions event policy for this file's path must allow
  # every event listed here.
  pull_request_target:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string
      harness:
        description: Harness; 'default' uses the AGENT_REVIEW_HARNESS variable
        type: choice
        default: default
        options: [default, stub, opencode, pi]
      dry_run:
        description: Show the comment in the run summary instead of posting it
        type: boolean
        default: false

permissions: {}

# Never cancel: runs join the group before the job 'if' is evaluated, so any
# other label added to the PR would cancel an in-flight review.
concurrency:
  group: agent-review-${{ github.event.pull_request.number || inputs.pr || github.ref }}
  cancel-in-progress: false

jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'agent-review'
    # Pinned by commit SHA because the called workflow receives the key.
    uses: GridTools/ci-workflows/.github/workflows/agent-review.yml@fce720199ea669941f688b41dff6857e97faa401 # v0.1.0
    # Must cover what the called jobs request, or the run fails at startup.
    permissions:
      contents: read
      pull-requests: write
    with:
      # Only 'harness' and 'model' may come from variables, which any writer
      # can change without review.
      harness: ${{ (inputs.harness == '' || inputs.harness == 'default') && vars.AGENT_REVIEW_HARNESS || inputs.harness }}
      model: ${{ vars.AGENT_REVIEW_MODEL }}
      pr: ${{ inputs.pr }}
      dry_run: ${{ inputs.dry_run == true }}
      project_name: ICON4Py
      # Reset to the PR's base version, so a PR cannot change its own rules.
      rule_files: |
        .github/copilot-instructions.md
        AGENTS.md
        CODING_GUIDELINES.md
      prompt_addendum: .github/agent-review/prompt-addendum.md
      # No 'upload_audit': any signed-in user could download the artifact.
    # An environment secret ('agent-review', restricted to 'main'), so it must
    # be mapped explicitly; never 'secrets: inherit'.
    secrets:
      inference_api_key: ${{ secrets.AGENT_REVIEW_INFERENCE_API_KEY }}
