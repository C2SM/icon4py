name: PR Agent

# Advisory AI review of pull requests; never a required status check.
# See docs/development/pr_agent.md.

on:
  # Not 'pull_request': fork pull requests get no repository secrets there.
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

# No 'contents: write': a prompt injection in a diff must not become a way to push.
permissions:
  contents: read
  issues: write
  pull-requests: write

# Never cancel: runs join the group before the job 'if' is evaluated, so any
# PR comment would cancel an in-flight review.
concurrency:
  group: pr-agent-${{ github.event_name }}-${{ github.event.comment.id || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  pr-agent:
    # Structural filters only; authorization happens in the 'Authorize' step.
    if: >-
      github.event.sender.type != 'Bot'
      && (
        (
          github.event_name == 'pull_request_target'
          && github.event.pull_request.draft == false
          && github.event.pull_request.user.type != 'Bot'
        )
        || (
          github.event_name == 'issue_comment'
          && github.event.issue.pull_request != null
          && startsWith(github.event.comment.body, '/')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45 # Keep in sync with JOB_TIMEOUT below.
    steps:
      # The only gate, since 'pull_request_target' ignores fork approval.
      # Fails closed: an API error fails the job instead of denying silently.
      - name: Authorize
        id: auth
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.event_name == 'issue_comment' && github.event.comment.user.login || github.event.pull_request.user.login }}
          BODY: ${{ github.event.comment.body }}
        run: |
          skip() {
            echo "::notice::$1"
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if ! level=$(gh api "repos/${REPO}/collaborators/${ACTOR}/permission" \
            --jq '.permission' 2>&1); then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "::error::Could not resolve repository permission for '${ACTOR}', denying: '${level}'."
            exit 1
          fi
          # 'permission' reports the 'maintain' role as 'write'.
          case "${level}" in
            admin | write) ;;
            *) skip "${ACTOR} has '${level}' permission; skipping PR Agent." ;;
          esac
          # Other commands can write labels, and '--section.key=value' arguments
          # override any setting not reserved to the host, including the ones
          # that keep model output out of labels and the PR description.
          if [ "${EVENT}" = "issue_comment" ]; then
            case "${BODY%%[[:space:]]*}" in
              /review | /improve | /ask | /describe | /help) ;;
              *) skip "Ignoring '${BODY%%[[:space:]]*}': only /review, /improve, /ask, /describe and /help are enabled." ;;
            esac
            if grep -qE '(^|[[:space:]"])--' <<<"${BODY}"; then
              skip "Ignoring the command: '--' setting arguments are not accepted."
            fi
          fi
          echo "::notice::${ACTOR} has '${level}' permission; running PR Agent."
          echo "allowed=true" >> "$GITHUB_OUTPUT"

      # Validated here because the next step tolerates failure.
      - name: Resolve models
        id: models
        if: steps.auth.outputs.allowed == 'true'
        env:
          MODEL: ${{ vars.PR_AGENT_MODEL }}
          FALLBACKS: ${{ vars.PR_AGENT_FALLBACK_MODELS }}
          BUDGET: ${{ vars.PR_AGENT_TOKEN_BUDGET || '262144' }}
          OUTPUT: ${{ vars.PR_AGENT_MAX_OUTPUT_TOKENS || '100000' }}
          AI_TIMEOUT: ${{ vars.PR_AGENT_AI_TIMEOUT || '720' }}
          JOB_TIMEOUT: "45"
        run: |
          fail() {
            echo "::error::$1 See docs/development/pr_agent.md#configuration-variables."
            exit 1
          }
          positive() {
            case "$2" in
              '' | 0* | *[!0-9]*) : ;;
              *) [ "$2" -gt 0 ] && return 0 ;;
            esac
            fail "Repository variable $1 must be a positive integer without leading zeros, got '$2'."
          }
          [ -n "${MODEL}" ] || fail "Repository variable PR_AGENT_MODEL is not set."
          [ -n "${FALLBACKS}" ] || fail "Repository variable PR_AGENT_FALLBACK_MODELS is not set; use 'none' for no fallback."
          # PR Agent reads a non-positive limit as "no limit".
          positive PR_AGENT_TOKEN_BUDGET "${BUDGET}"
          positive PR_AGENT_MAX_OUTPUT_TOKENS "${OUTPUT}"
          positive PR_AGENT_AI_TIMEOUT "${AI_TIMEOUT}"
          [ "${AI_TIMEOUT}" -le "$(( JOB_TIMEOUT * 60 ))" ] || fail "PR_AGENT_AI_TIMEOUT (${AI_TIMEOUT}s) exceeds the ${JOB_TIMEOUT} min job limit."
          [ "${BUDGET}" -gt "${OUTPUT}" ] || fail "PR_AGENT_TOKEN_BUDGET (${BUDGET}) must be greater than PR_AGENT_MAX_OUTPUT_TOKENS (${OUTPUT})."

          fallbacks='[]'
          [ "${FALLBACKS}" = "none" ] || fallbacks=$(jq -Rc 'split(",") | map(gsub("^\\s+|\\s+$";"")) | map(select(length > 0)) | map("openai/" + .)' <<<"${FALLBACKS}")
          # Every model may time out in turn. A job timeout would cancel the run
          # and turn it red, so the chain must fit under the job limit.
          chain=$(( 1 + $(jq 'length' <<<"${fallbacks}") ))
          step=$(( (chain * AI_TIMEOUT + 59) / 60 + 2 ))
          [ "$(( step + 2 ))" -le "${JOB_TIMEOUT}" ] || fail "${chain} models at ${AI_TIMEOUT}s need ${step} min, leaving no margin under the ${JOB_TIMEOUT} min job limit. Lower PR_AGENT_AI_TIMEOUT, shorten PR_AGENT_FALLBACK_MODELS, or raise the job's timeout-minutes and JOB_TIMEOUT together."

          {
            echo "fallbacks=${fallbacks}"
            echo "budget=${BUDGET}"
            echo "output=${OUTPUT}"
            echo "ai_timeout=${AI_TIMEOUT}"
            echo "step_timeout=${step}"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Model openai/${MODEL}, fallbacks ${fallbacks}; context window ${BUDGET}, output reserve ${OUTPUT}, ${AI_TIMEOUT}s per model, ${step} min for the chain."

      # Never add 'actions/checkout': this job holds a secret and must not run
      # pull request code. PR Agent reads the diff through the GitHub API.
      - name: Run PR Agent
        id: pragent
        if: success() && steps.auth.outputs.allowed == 'true'
        continue-on-error: true
        # 'fromJSON' because the runner ignores a timeout that is not a number.
        timeout-minutes: ${{ fromJSON(steps.models.outputs.step_timeout) }}
        # Tag '0.50.0-github_action', pinned because the image receives the key.
        uses: docker://pragent/pr-agent@sha256:548e894a88071180832b2f4233f734d0acd0db1a879e2fcbaa70bac8b8372ebe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Shared with the weekly Slack summary workflow.
          OPENAI.KEY: ${{ secrets.CSCS_INFERENCE_API_KEY }}
          OPENAI.API_BASE: ${{ vars.PR_AGENT_API_BASE || 'https://api.inference.cscs.ch/v1' }}
          config.model: openai/${{ vars.PR_AGENT_MODEL }}
          config.fallback_models: ${{ steps.models.outputs.fallbacks }}
          config.custom_model_max_tokens: ${{ steps.models.outputs.budget }}
          config.max_model_tokens: ${{ steps.models.outputs.budget }}
          config.max_output_tokens: ${{ steps.models.outputs.output }}
          # Helps open-weight models follow the output schema.
          config.duplicate_prompt_examples: "true"
          # Timeouts and rejected requests (429, 5xx) move on to the next model,
          # since the step limit allows one request per model.
          config.ai_timeout: ${{ steps.models.outputs.ai_timeout }}
          config.retry_same_model_on_timeout: "false"
          config.num_retries: "0"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
          # Model output must not write labels or the PR body. Set here rather
          # than in '.pr_agent.toml', which PR Agent skips if fetching it fails.
          pr_reviewer.enable_review_labels_effort: "false"
          pr_reviewer.enable_review_labels_security: "false"
          pr_description.publish_description_as_comment: "true"
          # PR Agent accepts this key only from the host, not '.pr_agent.toml'.
          pr_reviewer.publish_error_details: "true"

      # 'outcome' is the result before 'continue-on-error' turns it into success.
      # A run started from a comment does not show up on the PR, so the failure
      # is also reported there, in one comment that a later success removes.
      - name: Report the PR Agent outcome on the PR
        if: steps.pragent.outcome == 'failure' || steps.pragent.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          OUTCOME: ${{ steps.pragent.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker='<!-- pr-agent-run-failed -->'
          ids=$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"${marker}\"))) | .id")
          existing=$(tail -n 1 <<<"${ids}")
          # Overlapping runs can each create one: keep at most the newest.
          for id in ${ids}; do
            if [ "${OUTCOME}" = "success" ] || [ "${id}" != "${existing}" ]; then
              gh api -X DELETE "repos/${REPO}/issues/comments/${id}"
            fi
          done
          if [ "${OUTCOME}" = "success" ]; then
            exit 0
          fi
          echo "::warning title=PR Agent failed::No review was posted. See the 'Run PR Agent' log."
          body="${marker}
          **PR Agent could not complete its last run** ([log](${RUN_URL})). The review is advisory, so nothing needs to be done; a user with write access can retry with \`/review\`."
          if [ -n "${existing}" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${existing}" -f body="${body}" --silent
          else
            gh api "repos/${REPO}/issues/${PR}/comments" -f body="${body}" --silent
          fi
